<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <style>
    .box { fill:#e8f0e8; stroke:#2d4a2d; stroke-width:1.4; }
    .sat { fill:#efe8f4; stroke:#4a2d5a; stroke-width:1.2; }
    .t { font: 13px ui-sans-serif, system-ui, sans-serif; fill:#1a1a1a; }
    .s { font: 11px ui-sans-serif, system-ui, sans-serif; fill:#333; }
    .l { stroke:#444; stroke-width:1.2; fill:none; }
  </style>
  <rect class="box" x="20" y="90" width="200" height="90" rx="6"/>
  <text class="t" x="120" y="128" text-anchor="middle">Silová NN/VN/VVN</text>
  <text class="s" x="120" y="148" text-anchor="middle">140 × 80 mm · 2L 70 µm</text>
  <text class="s" x="120" y="164" text-anchor="middle">jen sekundár CT · LiFePO4/LTO</text>

  <line class="l" x1="220" y1="135" x2="280" y2="135"/>
  <text class="s" x="250" y="128" text-anchor="middle">2×10</text>

  <rect class="box" x="280" y="70" width="220" height="130" rx="6"/>
  <text class="t" x="390" y="108" text-anchor="middle">Core 6L Faraday</text>
  <text class="s" x="390" y="128" text-anchor="middle">160 × 100 mm · RP2350B</text>
  <text class="s" x="390" y="144" text-anchor="middle">J_MESH Heltec V3 868</text>
  <text class="s" x="390" y="160" text-anchor="middle">6× RJ45 LVDS</text>
  <text class="s" x="390" y="176" text-anchor="middle">100 Ω RX · CMC · ferit 3V3</text>

  <line class="l" x1="500" y1="135" x2="540" y2="135"/>
  <text class="s" x="520" y="126" text-anchor="middle">STP</text>

  <g transform="translate(540,40)">
    <rect class="sat" x="0" y="0" width="70" height="44" rx="4"/>
    <text class="s" x="35" y="20" text-anchor="middle">sat 1</text>
    <text class="s" x="35" y="34" text-anchor="middle">8× SK6812</text>
    <rect class="sat" x="80" y="0" width="70" height="44" rx="4"/>
    <text class="s" x="115" y="20" text-anchor="middle">sat 2</text>
    <text class="s" x="115" y="34" text-anchor="middle">50 × 80 6L</text>
    <rect class="sat" x="0" y="54" width="70" height="44" rx="4"/>
    <text class="s" x="35" y="74" text-anchor="middle">sat 3</text>
    <rect class="sat" x="80" y="54" width="70" height="44" rx="4"/>
    <text class="s" x="115" y="74" text-anchor="middle">sat 4</text>
    <rect class="sat" x="0" y="108" width="70" height="44" rx="4"/>
    <text class="s" x="35" y="128" text-anchor="middle">sat 5</text>
    <rect class="sat" x="80" y="108" width="70" height="44" rx="4"/>
    <text class="s" x="115" y="128" text-anchor="middle">sat 6</text>
  </g>
  <text class="s" x="360" y="250" text-anchor="middle">het68 v4.1.0 · na měď nejde 230 V / 22 kV / 110 kV</text>
</svg>
